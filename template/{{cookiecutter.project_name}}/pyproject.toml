[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "{{cookiecutter.project_name}}"
version = "0.0.0"

[tool.hatch.envs.default]
skip-install = true
dependencies = [
    "jupyter~=1.0",
    "git-author-stats[github]~=0.3",
    "polars~=1.3",
    "pandas~=2.2",
    "hvplot~=0.10",
    "pyarrow~=17.0",
    "TeX~=1.8",
    "matplotlib~=3.9",
    "dependence~=1.0",
    "mypy",
    "nbqa",
    "ruff"
]
post-install-commands = [
    "hatch run mypy --install-types --non-interactive || echo",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = [
    "F842",
    "INP001",
]
extend-select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "C",
    "N",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
wrap_length = 79
multi_line_output = 3
