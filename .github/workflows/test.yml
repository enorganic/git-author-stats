name: test
on:
  push:
    branches:
    - main
  workflow_dispatch:
  pull_request:
    paths:
    - src/**
    - pyproject.toml
    - tests/**
    - .github/workflows/test.yml
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Hatch
      uses: pypa/hatch@install
    - run: hatch fmt --check && hatch run mypy
  test:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python:
        - 3.9
        - '3.10'
        - 3.11
        - 3.12
        - 3.13
    steps:
    - uses: actions/checkout@v4
    - name: Install Hatch
      uses: pypa/hatch@install
    - run: echo $(hatch run python -m git_author_stats https://github.com/enorganic -f 1w --since 2024-06-14 -p ${{ github.token }}) | head -n 10
    - name: test
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONUNBUFFERED: 1
      run: hatch test -c -py ${{ matrix.python }}
